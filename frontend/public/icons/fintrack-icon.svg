<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#132320" />
      <stop offset="60%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#05080e" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#glowRing)" stroke-width="3" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="240" r="150" fill="#10b981" fill-opacity="0.12" filter="blur(30px)" />

  <!-- Shield / Wallet Card Container -->
  <g filter="url(#shadow)">
    <!-- Wallet / Card Body -->
    <rect x="116" y="140" width="280" height="232" rx="36" fill="#0b1320" stroke="url(#emeraldGrad)" stroke-width="7" />
    
    <!-- Decorative Card Stripe -->
    <path d="M 116 195 L 396 195" stroke="#1f2d3d" stroke-width="4" stroke-linecap="round" />

    <!-- Wallet Clasp / Badge -->
    <rect x="300" y="226" width="96" height="60" rx="16" fill="url(#emeraldGrad)" />
    <circle cx="348" cy="256" r="10" fill="#05080e" />

    <!-- Financial Growth Trend Path / 'F' Motif -->
    <path d="M 166 310 L 166 220 C 166 220 200 220 226 220 C 246 220 256 230 256 244 C 256 258 244 268 224 268 L 166 268" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dynamic Upward Growth Arrow -->
    <path d="M 180 320 L 220 280 L 255 305 L 315 245" 
          fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 295 245 L 315 245 L 315 265" 
          fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkle Accent -->
  <circle cx="396" cy="130" r="6" fill="#34d399" />
  <circle cx="396" cy="130" r="14" fill="#34d399" fill-opacity="0.3" />
</svg>

